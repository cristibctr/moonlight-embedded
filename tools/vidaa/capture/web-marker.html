<!doctype html><meta charset="utf-8"><title>Moonlight delay benchmark</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#141414}canvas{display:block;width:100%;height:100%}</style>
<canvas id="marker"></canvas>
<script>
"use strict";
const canvas=document.getElementById('marker'), ctx=canvas.getContext('2d',{alpha:false});
const base=location.pathname.replace(/\/marker$/, ''), started=performance.now();
const pageId=crypto.getRandomValues(new Uint32Array(1))[0];
const motionMode=location.hash==='#motion';
let motionPattern=null;
let offset=0, ready=false, seq=0, nextDraw=0;
function drawMotion(w,h,frame){
  if(!motionPattern){
    const tile=document.createElement('canvas');tile.width=512;tile.height=512;
    const tc=tile.getContext('2d'), pixels=tc.createImageData(512,512);
    let seed=0x8e917bad;
    for(let y=0;y<512;y++)for(let x=0;x<512;x++){
      seed^=seed<<13;seed^=seed>>>17;seed^=seed<<5;
      const p=(y*512+x)*4, grain=(seed>>>0)%64;
      // Keep backdrop brightness below the white marker-border threshold.
      pixels.data[p]=32+grain+((x>>3)%5)*16;
      pixels.data[p+1]=32+grain+((y>>3)%5)*16;
      pixels.data[p+2]=32+grain+(((x+y)>>4)%5)*16;
      pixels.data[p+3]=255;
    }
    tc.putImageData(pixels,0,0);motionPattern=ctx.createPattern(tile,'repeat');
  }
  ctx.save();ctx.fillStyle=motionPattern;
  const shift=(frame*7)%512;ctx.translate(-shift,-shift/2);
  ctx.fillRect(0,0,w+512,h+512);ctx.restore();
  ctx.save();ctx.globalAlpha=.5;ctx.fillStyle=motionPattern;
  const second=(frame*11)%512;ctx.translate(-second/2,-second);
  ctx.fillRect(0,0,w+512,h+512);ctx.restore();
}
function crc16(bytes){let c=65535;for(const b of bytes){c^=b<<8;for(let j=0;j<8;j++)c=((c<<1)^((c&32768)?0x1021:0))&65535;}return c;}
async function calibrate(){
  const samples=[];
  for(let i=0;i<24;i++){
    const a=performance.now();
    const reply=await fetch(base+'/clock',{cache:'no-store'});
    const data=await reply.json(), d=performance.now();
    samples.push({a,b:data.receive_ms,c:data.send_ms,d});
  }
  // Add 1 ms at each end for browser clock quantization and JSON timing.
  const low=Math.max(...samples.map(s=>s.c-s.d-1));
  const high=Math.min(...samples.map(s=>s.b-s.a+1));
  if(low>high||high-low>15)throw Error('Clock calibration too uncertain');
  // Keep the rendered clock stable. Later checks bound its drift without
  // introducing time steps into the measured source.
  if(!ready)offset=(low+high)/2;
  const posted=await fetch(base+'/calibration',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({offset_low_ms:low,offset_high_ms:high,render_offset_ms:offset,
      browser_time_ms:performance.now(),samples,marker_version:'page-id-60hz-v3',page_id:pageId,
      requested_draw_fps:60,
      motion_mode:motionMode,canvas_pixels:[canvas.width,canvas.height],
      user_agent:navigator.userAgent,viewport:[innerWidth,innerHeight],screen:[screen.width,screen.height]})});
  if(!posted.ok)throw Error('Clock calibration was rejected');
  ready=true;
}
async function checkClock(){
  if(performance.now()-started>1800000)return;
  try{await calibrate();}catch(e){console.warn('Clock check failed:',e.message);}
  setTimeout(checkClock,20000);
}
function draw(t){
  if(performance.now()-started>1800000){ready=false;ctx.fillStyle='black';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.fillStyle='white';ctx.font='24px sans-serif';ctx.fillText('Benchmark expired. Reload to calibrate again.',40,60);return;}
  requestAnimationFrame(draw);
  // Keep a 60 Hz time grid. Resetting to each actual callback would turn a
  // 144 Hz display into a 48 Hz marker (one draw every three callbacks).
  const period=1000/60;
  if(t+.5<nextDraw)return;
  nextDraw+=(Math.max(0,Math.floor((t-nextDraw)/period))+1)*period;
  const w=innerWidth,h=innerHeight;
  const scale=motionMode?Math.min(2,Math.max(1,globalThis.devicePixelRatio||1)):1;
  if(canvas.width!==Math.round(w*scale)||canvas.height!==Math.round(h*scale)){
    canvas.width=Math.round(w*scale);canvas.height=Math.round(h*scale);
  }
  // A display-mode change can keep the same backing dimensions but change
  // CSS size/DPR. Set drawing state each frame; never leave old pixels outside
  // a stale transform. This also repairs a restored canvas context.
  ctx.setTransform(scale,0,0,scale,0,0);ctx.globalAlpha=1;
  const ms=Math.floor(performance.now()+offset)>>>0;
  ctx.fillStyle='#141414';ctx.fillRect(0,0,w,h);
  if(!ready){ctx.fillStyle='white';ctx.font='24px sans-serif';ctx.fillText('Calibrating clocks...',40,60);return;}
  if(motionMode)drawMotion(w,h,seq+1);
  seq=(seq+1)&65535;
  const p=[77,78,ms>>>24,(ms>>>16)&255,(ms>>>8)&255,ms&255,seq>>>8,seq&255,
    pageId>>>24,(pageId>>>16)&255,(pageId>>>8)&255,pageId&255];
  const crc=crc16(p);p.push(crc>>>8,crc&255);
  const x=w*(motionMode ? .03 : .08),y=h*(motionMode ? .21 : .17),mw=w*(motionMode ? .46 : .84),mh=h*(motionMode ? .58 : .66);
  ctx.fillStyle='white';ctx.fillRect(x,y,mw,mh);
  const gx=x+mw*.05,gy=y+mh*.05,gw=mw*.9,gh=mh*.9;
  ctx.fillStyle='black';ctx.fillRect(gx,gy,gw,gh);
  ctx.fillStyle='white';
  for(let bit=0;bit<112;bit++)if(p[bit>>3]&(1<<(7-bit%8)))
    ctx.fillRect(gx+(bit%14)*gw/14,gy+Math.floor(bit/14)*gh/8,gw/14,gh/8);
  ctx.fillStyle='#aaa';ctx.font=(h*.035)+'px monospace';
  ctx.fillText('Moonlight '+(motionMode?'motion stress':'delay test')+' - page '+pageId.toString(16),w*.08,h*.10);
  ctx.fillText('Frame '+seq+'   Source clock '+ms+' ms',w*.08,h*.94);
}
calibrate().then(()=>setTimeout(checkClock,20000)).catch(e=>{document.body.textContent=e.message;document.body.style.color='white';});
requestAnimationFrame(draw);
</script>
